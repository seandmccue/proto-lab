<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="ProtoLab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6fa"/>
      <stop offset="1" stop-color="#c3cbd6"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="#2f7cff" stroke-opacity=".45"/>
  <!-- blueprint roll under the left arm -->
  <rect x="3.5" y="33" width="11" height="5.5" rx="2.75" fill="#2f7cff"/>
  <path d="M6 35.75h5.5" stroke="#cfe0ff" stroke-width="1" stroke-linecap="round"/>
  <circle cx="13.2" cy="35.75" r="1.9" fill="#174bb0"/>
  <circle cx="13.2" cy="35.75" r=".8" fill="#cfe0ff"/>
  <!-- hammer in the right hand -->
  <path d="M36.5 35.5 41 26" stroke="#b87f4a" stroke-width="2.6" stroke-linecap="round"/>
  <g transform="rotate(29 41.5 24.5)">
    <rect x="36.5" y="22" width="10" height="5" rx="1.4" fill="#9aa5b4"/>
    <rect x="36.5" y="22" width="4.5" height="5" rx="1.4" fill="#6b7686"/>
  </g>
  <!-- arms -->
  <path d="M18 37.5 12.5 36.5" stroke="#aab3bf" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M30 37.5 36.5 35.5" stroke="#aab3bf" stroke-width="3.2" stroke-linecap="round"/>
  <!-- body -->
  <rect x="16.5" y="33" width="15" height="10.5" rx="3.5" fill="url(#steel)"/>
  <rect x="20" y="36" width="8" height="1.6" rx=".8" fill="#2f7cff" opacity=".9"/>
  <circle cx="24" cy="40.3" r="1.3" fill="#2f7cff"/>
  <!-- neck -->
  <rect x="21.5" y="30.5" width="5" height="3.5" fill="#8b96a6"/>
  <!-- head -->
  <rect x="13.5" y="18.5" width="21" height="13" rx="4.5" fill="url(#steel)"/>
  <rect x="16.5" y="21.5" width="15" height="7" rx="3.5" fill="#0d1016"/>
  <circle cx="21" cy="25" r="1.8" fill="#4d8fff"/>
  <circle cx="27" cy="25" r="1.8" fill="#4d8fff"/>
  <circle cx="21" cy="25" r=".7" fill="#dbe8ff"/>
  <circle cx="27" cy="25" r=".7" fill="#dbe8ff"/>
  <!-- hard hat -->
  <path d="M14.5 18.5a9.5 8.5 0 0 1 19 0z" fill="url(#hat)"/>
  <rect x="11" y="17.2" width="26" height="3.6" rx="1.8" fill="#f5a524"/>
  <rect x="21.5" y="9.5" width="5" height="8" rx="2" fill="#ffe08a" opacity=".85"/>
</svg>
